name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p arf-core -p arf-dictc
      - run: cargo check -p arf-win

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p arf-core
      - run: cargo build --release -p arf-win
      - name: Registration safety tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'tools/browser-integration-manager.ps1'
            'tools/browser-native-host-registration.ps1'
            'tools/browser-registration-policy.ps1'
            'tools/browser-registration-snapshot.ps1'
            'tools/test-browser-registration-policy.ps1'
            'tools/test-browser-registration-snapshot.ps1',
            'tools/test-browser-registration-wiring.ps1',
            'tools/browser-registration-transaction.ps1',
            'tools/test-browser-registration-transaction.ps1'
          )
          foreach ($file in $scripts) {
            $tokens = $null
            $errorsFound = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errorsFound
            )
            if (@($errorsFound).Count -gt 0) {
              throw "PowerShell syntax failed: $file"
            }
          }
          & ./tools/test-browser-registration-policy.ps1
          & ./tools/test-browser-registration-snapshot.ps1
          & ./tools/test-browser-registration-wiring.ps1
          & ./tools/test-browser-registration-transaction.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: arf-win-windows-x64
          path: |
            target/release/arf-win.exe
            data/
            config.example.toml
